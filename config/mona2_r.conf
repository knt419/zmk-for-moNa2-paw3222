# Right half only: split central with the trackball sensor.

#Mouse config ---------------------
# The trackball uses the upstream Zephyr PixArt PAW32xx driver; its devicetree
# node lives in boards/shields/mona2/mona2_r.overlay.
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_PAW32XX=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

#Split config -------------------
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=4096

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=7
